# The starter web app's static files. Never framed
# (docker/headers.conf).
server {
    listen 8080;
    root /usr/share/nginx/html;

    include /etc/nginx/snippets/headers.conf;

    # Written at container start from the environment (40-config.sh). Never cached.
    location = /config.js {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Deep links are the SPA's.
    location / {
        try_files $uri /index.html;
    }
}
