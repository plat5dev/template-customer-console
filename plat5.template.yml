# plat5 init copies this app into a project's customer-console/ folder, beside the
# API starter: your customers' console, a client of the Plat5 gateway.
name: customer-console
kind: customer-console
description: Vite + React console for your customers (sign-in, orgs, projects and environments, members, keys)

substitute:
  - src/appName.ts

# plat5 start runs it from this compose file. Its origin may sign in with local Auth.
app:
  compose: docker-compose.yml
  web: http://localhost:3001

exclude:
  - .github
