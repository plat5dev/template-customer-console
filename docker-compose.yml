# The customer console, in development: Vite on :3001, reloading as you edit. plat5 start
# runs it (the project's docker-compose.yml includes this file) and passes where
# Plat5 is. The production image is the Dockerfile's last stage.
services:
  customer-console:
    build:
      context: .
      target: dev
    labels:
      service.name: customer-console
      service.namespace: customer-console
    ports:
      - "3001:3001"
    environment:
      VITE_GATEWAY_URL: ${PLAT5_GATEWAY_URL:-http://localhost:5400}
      VITE_AUTH_ISSUER: ${PLAT5_AUTH_URL:-http://localhost:5401}
      VITE_AUTH_CLIENT_ID: ${PLAT5_AUTH_CLIENT_ID:-plat5}
    volumes:
      - .:/app
      - customer_console_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 24
    restart: unless-stopped

volumes:
  customer_console_node_modules:
